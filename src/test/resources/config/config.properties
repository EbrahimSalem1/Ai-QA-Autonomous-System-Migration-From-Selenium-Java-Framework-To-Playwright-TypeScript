# Default configuration. Every key can be overridden by a JVM system property
# (-Dbase.url=...) or an environment variable (BASE_URL=...).
base.url=https://demo.opencart.com
language=en-gb
browser=chrome
headless=true
explicit.wait.seconds=15
page.load.timeout.seconds=60
window.width=1440
window.height=900
# Optional pre-existing account for @auth scenarios. Leave empty to create one per run.
customer.email=
customer.password=
